<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Um mimo para você · Capimimo</title><link rel="icon" href="/assets/favicon.webp"><link rel="stylesheet" href="/fonts.css"><link rel="stylesheet" href="/present.css"><link rel="stylesheet" href="/capi-animation.css"></head>
<body><main>
<section class="gift-stage" aria-label="Seu presente">
<header class="recipient-header"><a class="brand" href="/" aria-label="Capimimo, página inicial"><img src="/assets/favicon.webp" width="30" height="30" alt="">capimimo.</a><h1>Tem um mimo para você.</h1></header>
<div class="gift-space"><p class="test-notice" hidden>Presente de teste · sem cobrança</p><div class="gift-loading" aria-hidden="true"><span class="capi-loader" aria-hidden="true"></span><span class="gift-loading-text">Um carinho está chegando.</span></div><iframe title="Seu presente personalizado" sandbox="allow-scripts allow-downloads allow-popups" referrerpolicy="no-referrer" allow="autoplay; fullscreen" allowfullscreen hidden></iframe></div>
<footer class="recipient-toolbar"><p class="present-status" role="status">Preparando sua surpresa…</p><button type="button" class="present-retry" hidden>Tentar abrir novamente</button><div class="present-actions" hidden><button type="button" class="present-fullscreen" aria-pressed="false">Tela cheia</button><button type="button" class="present-copy">Copiar link</button><a class="present-download" download>Guardar cópia</a></div><label class="share-fallback" hidden>Link do presente<input class="share-link" readonly></label><button type="button" class="present-rsvp-link" hidden>Responder ao convite ↓</button></footer>
</section>
<section class="rsvp" hidden><p class="eyebrow">SEU CONVITE</p><h2 tabindex="-1">Você vem celebrar?</h2><p class="guest-name"></p><form><label>Sua resposta<select name="status"><option value="accepted">Sim, vou participar</option><option value="declined">Não poderei ir</option></select></label><label class="attending-label">Quantas pessoas vão?<input name="count" type="number" min="1" value="1" required></label><button type="submit">Confirmar minha resposta</button><p class="rsvp-status" role="status"></p></form><button type="button" class="back-to-gift">Voltar ao presente ↑</button></section>
<p class="access-note">Não é preciso criar uma conta. Abra seu presente e use os controles para ler com calma.</p>
</main><script type="module" src="/present.js"></script></body></html>
